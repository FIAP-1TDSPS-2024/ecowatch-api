trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  buildConfiguration: Release
  dotnetVersion: "8.x"
  projectPath: "EcoWatch.Api/EcoWatch.Api.csproj"
  publishOutput: "$(Build.ArtifactStagingDirectory)/publish"

  azureServiceConnection: "fire-shield-sc"
  webAppName: "app-fire-shield"

stages:
  - stage: Build
    displayName: Build e Publicar
    jobs:
      - job: Build
        steps:
          - task: UseDotNet@2
            displayName: Instalar .NET $(dotnetVersion)
            inputs:
              version: $(dotnetVersion)

          - task: DotNetCoreCLI@2
            displayName: Restore
            inputs:
              command: restore
              projects: "*.sln"

          - task: DotNetCoreCLI@2
            displayName: Build
            inputs:
              command: build
              projects: "*.sln"
              arguments: "--configuration $(buildConfiguration) --no-restore"

          - task: DotNetCoreCLI@2
            displayName: Publish
            inputs:
              command: publish
              projects: $(projectPath)
              arguments: "--configuration $(buildConfiguration) --no-build --output $(publishOutput)"
              zipAfterPublish: true

          - task: PublishBuildArtifacts@1
            displayName: Salvar Artefato
            inputs:
              PathtoPublish: $(publishOutput)
              ArtifactName: drop

  - stage: Deploy
    displayName: Deploy no Azure Web App
    dependsOn: Build
    condition: succeeded()
    jobs:
      - deployment: Deploy
        environment: production
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebApp@1
                  displayName: Deploy para $(webAppName)
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    appType: webApp
                    appName: $(webAppName)
                    package: "$(Pipeline.Workspace)/drop/*.zip"
                    deploymentMethod: zipDeploy
